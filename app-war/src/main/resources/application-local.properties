spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=icn_queries
spring.datasource.password=${ICN_DB_PASSWORD:tu_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Origen del ICN desde el que el plug-in llama a la API (CorsConfig).
cors.allowed-origins=http://181.62.240.183:9085

# HTTPS local: la CSP de ICN solo deja al navegador conectarse a https:, así que http://localhost no sirve.
# Certificado autofirmado (no se versiona); para generarlo:
#   keytool -genkeypair -alias localhost -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 \
#     -keystore src/main/resources/localhost.p12 -storepass changeit -keypass changeit \
#     -dname "CN=localhost" -ext "SAN=dns:localhost,ip:127.0.0.1"
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:localhost.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=localhost
# HTTP adicional (HttpConnectorConfig) para Postman y pruebas; ICN debe usar el https de server.port.
server.http-port=8080
