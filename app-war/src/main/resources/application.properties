# WebSphere publica java:comp/UserTransaction y Spring Boot activaría JTA; con PARENT_LAST el
# javax.transaction del WAR choca con el del servidor. Un solo datasource no necesita JTA.
# spring.jta.enabled=false
# spring.jpa.open-in-view=false
# Imprime las consultas SQL que genera Hibernate (salida estándar; en WebSphere, SystemOut.log).
# Es el único parámetro que hay que activar/desactivar; aplica a todos los perfiles.
spring.jpa.show-sql=true
# Formato legible del SQL cuando spring.jpa.show-sql=true.
spring.jpa.properties.hibernate.format_sql=true
#---
spring.config.activate.on-profile=!local

server.servlet.context-path=/icn-api-dynamic-queries
spring.datasource.jndi-name=jdbc/ConsGralDS
#app.db.schema=CMDCXN2
#spring.jpa.properties.hibernate.default_schema=${app.db.schema}
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=none
server.forward-headers-strategy=native
# server.port=9085
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.WebSphereExtendedJtaPlatform


